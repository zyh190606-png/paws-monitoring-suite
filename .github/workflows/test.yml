name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: HPC dashboard tests
        working-directory: hpc_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Local monitor tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s local_monitor/tests -p "test_*.py" -v

